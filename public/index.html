<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bedrock Connector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">

    <h1>⛏ Bedrock Connector</h1>

    <form id="form">
      <input id="host" type="text" placeholder="Server address  (e.g. play.example.com)" autocomplete="off" spellcheck="false" />
      <input id="port" type="number" value="19132" min="1" max="65535" />
      <button type="submit" id="submit-btn">Connect</button>
    </form>

    <div id="status" class="status">
      <span class="dot" id="dot"></span>
      <span id="status-text">Starting…</span>
    </div>

    <div class="lan-address" id="lan-address">—</div>
    <p class="lan-hint">Open Minecraft → Play → LAN Games</p>

  </div>

  <script src="app.js"></script>
</body>
</html>
